<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/global.css"> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=PT+Sans+Caption:wght@400;700&display=swap" rel="stylesheet">
  <title>Канцелярская компания</title>
</head>
<body>
    <header class="header">
        <div class="header_top_section">
            <div class="container header_container">
                <a href="index.html">
                    <img src="images/main-logo.png" alt="Логотип компании">
                </a>
                <div class="header_actions">
                    <form class="header_search_form">
                      <input class="header_search_field" type="search" placeholder="Поиск по товарам" title="Поиск по товарам">
                      <button class="button header_search_button">Найти</button>
                    </form>
                  
                    <a class="header_link" href="index.html" title="Поддержка магазина">
                      <img src="icons/phone.svg" alt="Телефон">
                      <div class="header_link_text">
                        <div class="header_link_caption">Поддержка магазина</div>
                        <div class="header_link_value">+7 (987) 700 98 42</div>
                      </div>
                    </a>
                  
                    <a class="header_link" href="cart.html" title="Перейти к корзине">
                      <img src="icons/cart.svg" alt="Корзина">
                      <div class="header_link_text">
                        <div class="header_link_caption">0</div>
                        <div class="header_link_value">Корзина</div>
                      </div>
                    </a>
                  </div>
            </div>
        </div>
        <div class="header_bottom_section">
            <div class="container header_container header_container_no_space_between">
              <button class="button categories_button">
                <img src="icons/menu_white.svg" alt="Меню">
                <span>Категории товаров</span>
              </button>
          
              <nav class="main_nav">
                <a href="index.html" class="nav_link active">Главная</a>
                <a href="#">Каталог</a>
                <a href="#">Новости</a>
                <a href="#">Доставка и оплата</a>
                <a href="#">Условия работы</a>
                <a href="#">О нас</a>
                <a href="#">Контакты</a>
              </nav>
            </div>
          </div>
    </header>
</body>
</html>
